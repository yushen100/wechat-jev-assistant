name: 发布 Windows 版本和 NuGet 包

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 读取版本号
        id: version
        shell: pwsh
        run: |
          $Version = "${{ github.ref_name }}" -replace '^v', ''
          if (-not $Version -or $Version -eq "main") { $Version = "0.1.0-dev.${{ github.run_number }}" }
          "value=$Version" >> $env:GITHUB_OUTPUT

      - name: 检查 README 已更新版本
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $Tag = "${{ github.ref_name }}"
          if (-not (Select-String -LiteralPath .\README.md -SimpleMatch $Tag -Quiet)) {
            throw "README.md 未包含当前版本 $Tag；请先更新版本和重点更新说明"
          }

      - name: 构建 Windows 部署包
        shell: pwsh
        run: .\scripts\0922_build_release_v1.ps1 -Version "${{ steps.version.outputs.value }}"

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 NuGet
        uses: NuGet/setup-nuget@v2

      - name: 构建 NuGet 包
        shell: pwsh
        run: |
          nuget pack .\packaging\WechatJevAssistant.nuspec `
            -Version "${{ steps.version.outputs.value }}" `
            -Properties "commit=${{ github.sha }}" `
            -OutputDirectory .\dist

      - name: 检查发布包中无私人目录
        shell: pwsh
        run: |
          $Bad = Get-ChildItem .\dist -Recurse -Force | Where-Object {
            $_.FullName -match '[\\/](data|logs|\.venv|runtime)([\\/]|$)' -or
            $_.Name -match '(?i)(history\.db|history\.key|\.env$)'
          }
          if ($Bad) { $Bad.FullName; throw "发布包包含禁止文件" }

      - name: 审查源码与归档内部
        shell: pwsh
        run: |
          python .\scripts\0923_发布隐私审查_v1.py
          if ($LASTEXITCODE -ne 0) { throw "源码隐私检查失败" }
          $Archives = Get-ChildItem .\dist -File | Where-Object { $_.Extension -in '.zip', '.nupkg' }
          python .\scripts\0923_发布隐私审查_v1.py @($Archives.FullName)
          if ($LASTEXITCODE -ne 0) { throw "归档隐私检查失败" }

      - name: 发布 NuGet Package
        shell: pwsh
        run: |
          nuget sources Add `
            -Name "github" `
            -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            -Username "${{ github.actor }}" `
            -Password "${{ secrets.GITHUB_TOKEN }}" `
            -StorePasswordInClearText
          nuget push ".\dist\WechatJevAssistant.${{ steps.version.outputs.value }}.nupkg" `
            -Source "github" `
            -ApiKey "${{ secrets.GITHUB_TOKEN }}" `
            -NonInteractive

      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" `
            .\dist\wechat-jev-assistant-*-windows.zip `
            .\dist\wechat-jev-assistant-*-windows.zip.sha256 `
            .\dist\WechatJevAssistant.*.nupkg `
            --title "微信 Jev 对话助手 ${{ github.ref_name }}" `
            --generate-notes
